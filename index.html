<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Did My Money Go?</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💰 Where Did My Money Go?</h1>
        <p class="subtitle">Track your daily expenses easily</p>

        <div class="summary">
            <div class="card">
                <h3>Total Spent</h3>
                <p id="total">₹0</p>
            </div>

            <div class="card">
                <h3>Transactions</h3>
                <p id="count">0</p>
            </div>
        </div>

        <div class="expense-form">

            <input type="text" id="description" placeholder="What did you spend on?">

            <input type="number" id="amount" placeholder="Amount">

            <select id="category">
                <option value="">Select Category</option>
                <option value="Food">🍔 Food</option>
                <option value="Travel">🚗 Travel</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Entertainment">🎬 Entertainment</option>
                <option value="Education">📚 Education</option>
                <option value="Other">📦 Other</option>
            </select>

            <button onclick="addExpense()">Add Expense</button>

        </div>

        <h2>My Expenses</h2>

        <div id="expenseList">
            <p class="empty">No expenses added yet.</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
